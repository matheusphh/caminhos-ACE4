services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdgd}
      POSTGRES_USER: ${POSTGRES_USER:-bdgd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdgd}
    volumes:
      - bdgd_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bdgd}:${POSTGRES_PASSWORD:-bdgd}@db:5432/${POSTGRES_DB:-bdgd}
      BDGD_REFERENCE_DATE: ${BDGD_REFERENCE_DATE:-não informada}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    volumes:
      - ./dados:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  importer:
    build: ./backend
    profiles: ["import"]
    entrypoint: ["python", "import_bdgd.py"]
    environment:
      BDGD_GDB: /data/BDGD.gdb
      POSTGRES_DB: ${POSTGRES_DB:-bdgd}
      POSTGRES_USER: ${POSTGRES_USER:-bdgd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdgd}
      DB_HOST: db
    volumes:
      - ./dados:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  bdgd_data:
